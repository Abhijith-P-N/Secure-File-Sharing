# ============================================================================
# Frontend container nginx config - serves the built React/Vite SPA.
# Author: Abhijith (Database, Storage & DevOps)
# ============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets can be cached aggressively (content-hashed)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # No server version disclosure
    server_tokens off;
}