# ============================================================================
# Frontend container nginx config - serves the built React/Vite SPA.
# Author: Abhijith (Database, Storage & DevOps)
# ============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy: self-only assets; the API lives on a separate origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must never be cached (each deploy is new)
        add_header Cache-Control "no-store" always;
    }

    # Static assets can be cached aggressively (content-hashed)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # No server version disclosure
    server_tokens off;
}