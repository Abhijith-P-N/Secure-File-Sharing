# ============================================================================
# Secure File Sharing Platform - Production reverse proxy / HTTPS terminator
# Author: Abhijith (Database, Storage & DevOps)
#
# Runs in front of backend (sfs-backend:8000) and frontend (sfs-frontend:80).
# - Terminates TLS with Let's Encrypt certificates
# - Never serves /storage (encrypted blobs are only reachable via the API)
# - Adds security headers + request size caps
#
# Deploy: docker compose --profile prod up -d   (see docs/DEPLOYMENT.md)
# ============================================================================
user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Upload size cap must match MAX_FILE_SIZE in the backend (100 MB default)
    client_max_body_size 100m;

    # Prevent information disclosure
    server_tokens off;

    upstream backend {
        server backend:8000;
    }
    upstream frontend {
        server frontend:80;
    }

    # ---- HTTP -> HTTPS redirect + ACME challenge ---------------------------
    server {
        listen 80;
        server_name ${NGINX_SERVER_NAME};

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS -------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name ${NGINX_SERVER_NAME};

        ssl_certificate     /etc/letsencrypt/live/${NGINX_SERVER_NAME}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${NGINX_SERVER_NAME}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # CSP placeholder - adjust to match the frontend's needs
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

        # Backend API
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}