name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '24'

jobs:

  # ============================================================
  # LINT
  # ============================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            secure-file-backend/package-lock.json
            frontend/package-lock.json

      # -------------------------
      # Backend
      # -------------------------
      - name: Install backend dependencies
        run: npm ci
        working-directory: secure-file-backend

      # -------------------------
      # Frontend
      # -------------------------
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend


  # ============================================================
  # BACKEND TESTS
  # ============================================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: secure_files_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: secure-file-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: secure-file-backend

      # -------------------------
      # Apply database schema
      # -------------------------
      - name: Apply database schema
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/secure_files_test

        run: |
          node --input-type=module -e "
            import pg from 'pg';
            import fs from 'node:fs';

            const client = new pg.Client({
              connectionString: process.env.DATABASE_URL
            });

            await client.connect();

            const schema = fs.readFileSync(
              'src/config/schema.sql',
              'utf8'
            );

            await client.query(schema);

            console.log('Database schema applied successfully');

            await client.end();
          "

        working-directory: secure-file-backend

      # -------------------------
      # Backend tests
      # -------------------------
      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/secure_files_test
          JWT_SECRET: test-jwt-secret
          FILE_ENCRYPTION_KEY: test-encryption-key-at-least-32-chars
          NODE_ENV: test
          DISABLE_RATE_LIMIT: '1'

        run: npm test
        working-directory: secure-file-backend


  # ============================================================
  # FRONTEND TESTS
  # ============================================================
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend


  # ============================================================
  # DOCKER BUILD & PUSH
  # ============================================================
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - test-backend
      - test-frontend

    if: >
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Convert GitHub repository name to lowercase
      # Docker/OCI image names must be lowercase.
      # --------------------------------------------------------
      - name: Set lowercase repository name
        id: repo
        shell: bash
        run: |
          REPOSITORY=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          echo "Repository:"
          echo "$REPOSITORY"

          echo "name=$REPOSITORY" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Display image names for debugging
      # --------------------------------------------------------
      - name: Show Docker image names
        run: |
          echo "Backend image:"
          echo "ghcr.io/${{ steps.repo.outputs.name }}/backend:${{ github.sha }}"

          echo "Frontend image:"
          echo "ghcr.io/${{ steps.repo.outputs.name }}/frontend:${{ github.sha }}"

      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Login to GitHub Container Registry
      # --------------------------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================
      # BACKEND IMAGE
      # ========================================================
      - name: Build and push backend image
        uses: docker/build-push-action@v6

        with:
          context: ./secure-file-backend

          push: true

          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/backend:${{ github.sha }}

          cache-from: type=gha

          cache-to: type=gha,mode=max

      # ========================================================
      # FRONTEND IMAGE
      # ========================================================
      - name: Build and push frontend image
        uses: docker/build-push-action@v6

        with:
          context: ./frontend

          push: true

          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/frontend:${{ github.sha }}

          cache-from: type=gha

          cache-to: type=gha,mode=max


  # ============================================================
  # STAGING DEPLOYMENT
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    needs:
      - build-images

    if: github.ref == 'refs/heads/develop'

    environment:
      name: staging

    steps:

      - name: Deploy to staging server
        run: |
          echo "=============================================="
          echo "Deploying VaultGuard to staging..."
          echo "=============================================="

          echo "Backend image:"
          echo "ghcr.io/${{ github.repository }}/backend:${{ github.sha }}"

          echo "Frontend image:"
          echo "ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}"

          echo ""
          echo "Staging deployment placeholder."
          echo "Configure SSH/deployment commands here."

          # Example:
          #
          # ssh deploy@staging "
          #   docker compose \
          #     -f /app/docker-compose.staging.yml \
          #     pull &&
          #
          #   docker compose \
          #     -f /app/docker-compose.staging.yml \
          #     up -d
          # "
