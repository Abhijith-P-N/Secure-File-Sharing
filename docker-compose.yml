services:
  postgres:
    image: postgres:16-alpine
    container_name: sfs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-secure_files}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database1/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-secure_files}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sfs-network

  backend:
    build:
      context: ./secure-file-backend
      dockerfile: Dockerfile
    container_name: sfs-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-secure_files}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:-change-me-in-production-at-least-32-chars}
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-2048}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sfs-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sfs-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sfs-network

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  sfs-network:
    driver: bridge